# Local deployment: one container running the UI, the Jira proxy, and a viewable browser
# for the SSO sign-in.
#
#   docker compose up -d --build   start it detached (first build pulls Chromium, so it is slow)
#   docker compose logs -f         watch the proxy
#   docker compose down            stop it
services:
  roadmap-runner:
    build: .
    image: roadmap-runner:local
    container_name: roadmap-runner
    ports:
      # Bound to loopback deliberately. This holds live Jira credentials and has no
      # authentication of its own, so it must not be reachable from the network.
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:6080:6080"
    volumes:
      # The session store, shared with a native `npm run server`: a gateway session
      # earned in either place then works in the other, which usually saves the
      # container a sign-in entirely. Run one at a time — both rewrite the whole file.
      - "${HOME}/.roadmap-runner:/root/.roadmap-runner"
      # The container's own Chromium profile, kept separate from the host's
      - "browser-profile:/var/lib/roadmap-runner"
    environment:
      # Both optional; empty falls back to the defaults (5 min / 2 h)
      JIRA_KEEPALIVE_MS: "${JIRA_KEEPALIVE_MS:-}"
      JIRA_KEEPALIVE_MAX_IDLE_MS: "${JIRA_KEEPALIVE_MAX_IDLE_MS:-}"
      # DEBUG=1 turns on per-request tracing (the JQL sent, the fields that came back).
      # Off by default so the log stays down to sign-ins, warnings, and errors.
      DEBUG: "${DEBUG:-}"
      # The story assistant. Unset means AGENT_MODE=mock, which answers locally: the rail
      # works, but says "mock" and talks to nothing. See the README for the real thing.
      AGENT_MODE: "${AGENT_MODE:-}"
      AGENT_TOKEN_ENDPOINT: "${AGENT_TOKEN_ENDPOINT:-}"
      AGENT_DIRECTLINE_SECRET: "${AGENT_DIRECTLINE_SECRET:-}"
      AGENT_URL: "${AGENT_URL:-}"
      AGENT_KEY: "${AGENT_KEY:-}"
      # AGENT_MODE=ollama runs the model on your machine. From in here "localhost" is the
      # container, so the host is reached by name — and Ollama must be listening on more
      # than 127.0.0.1 for that to connect at all (see the README).
      AGENT_OLLAMA_URL: "${AGENT_OLLAMA_URL:-http://host.docker.internal:11434}"
      AGENT_OLLAMA_MODEL: "${AGENT_OLLAMA_MODEL:-}"
    # Docker Desktop resolves host.docker.internal already; this adds it on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chromium outgrows Docker's 64MB default and starts crashing on heavier pages
    shm_size: "1gb"
    restart: unless-stopped

  # Ollama in a container, for a deployment that should carry its own model rather than
  # lean on one installed on the host. Opt in with `--profile ollama`, so the default
  # `docker compose up` is exactly what it was.
  #
  #   docker compose --profile ollama up -d --build
  #
  # Then point the app at it, in .env:  AGENT_MODE=ollama
  #                                     AGENT_OLLAMA_URL=http://ollama:11434
  #
  # On macOS this runs on the CPU: containers get no Metal, so a model that answers in
  # seconds natively will take considerably longer here. On a Linux host with an NVIDIA
  # card, uncomment the `deploy` block below and it runs on the GPU instead.
  ollama:
    image: ollama/ollama:latest
    container_name: roadmap-ollama
    profiles: ["ollama"]
    volumes:
      # The host's model store, so the models already pulled are reused rather than
      # downloaded again. Run one Ollama at a time — two of them pulling into the same
      # directory is the one way to get them to disagree.
      - "${HOME}/.ollama:/root/.ollama"
    # Deliberately not published. The app reaches it over the compose network by name,
    # and nothing else has any business talking to it.
    expose:
      - "11434"
    restart: unless-stopped
    # Linux + NVIDIA only; on macOS this block does nothing but stop the container starting
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  browser-profile:
